
name: Build Jakarta Temple APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir source
          unzip -o JakartaTempleAndroidCloudBuild.zip -d source
          find source -name gradlew -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Find Gradle wrapper
        run: |
          echo "Checking extracted files..."
          find . -type f -name gradlew
          echo "Checking ZIP files..."
          find . -maxdepth 3 -type f -iname '*.zip'
      

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jakarta-Temple-debug-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

